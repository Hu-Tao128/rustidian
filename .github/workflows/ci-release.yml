# Builds the platforms that cannot be produced on a Linux host (macOS and
# Windows) and uploads them to a GitHub Release. Dispatched on demand by
# scripts/build-release.sh.
name: Cross-platform Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v0.1.0)"
        required: true
        type: string
      version:
        description: "Version string (optional; defaults to Cargo.toml)"
        required: false
        type: string
      graph:
        description: "Build with the optional graph feature"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated platforms to build: macos, windows"
        required: false
        type: string
        default: "macos,windows"

permissions:
  contents: write

jobs:
  # ── macOS: arm64 (Apple Silicon) + x86_64 (Intel) ──────────────────────────
  macos:
    if: ${{ contains(inputs.platforms, 'macos') }}
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(grep -m1 '^version' rustidian-ui/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare app icon
        id: icon
        run: |
          set -euo pipefail
          OUT="build/AppIcon.icns"
          mkdir -p build
          if [[ -f "rustidian-ui/packaging/icons/macos/rustidian.icns" ]]; then
            cp "rustidian-ui/packaging/icons/macos/rustidian.icns" "$OUT"
          else
            PNG="rustidian-ui/packaging/icons/macos/rustidian_black.png"
            if [[ ! -f "$PNG" ]]; then
              PNG="$(ls rustidian-ui/packaging/icons/macos/*.png 2>/dev/null | head -1 || true)"
            fi
            if [[ -n "$PNG" && -f "$PNG" ]]; then
              ICONSET="build/AppIcon.iconset"
              rm -rf "$ICONSET"; mkdir -p "$ICONSET"
              for s in 16 32 64 128 256 512; do
                sips -z "$s" "$s" "$PNG" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
                d=$((s * 2))
                sips -z "$d" "$d" "$PNG" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns "$ICONSET" -o "$OUT"
            fi
          fi
          if [[ -f "$OUT" ]]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        env:
          GRAPH: ${{ inputs.graph }}
        run: |
          set -euo pipefail
          FEATURES=""
          if [[ "$GRAPH" == "true" ]]; then FEATURES="--features graph"; fi
          cargo build --release -p rustidian-ui --target "${{ matrix.target }}" $FEATURES

      - name: Package (.app, .dmg, .tar.gz, raw binary)
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/rustidian-ui"
          APP="Rustidian.app"

          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/rustidian-ui"
          if [[ "${{ steps.icon.outputs.have }}" == "true" ]]; then
            cp "build/AppIcon.icns" "$APP/Contents/Resources/AppIcon.icns"
          fi
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Rustidian</string>
              <key>CFBundleDisplayName</key><string>Rustidian</string>
              <key>CFBundleIdentifier</key><string>com.github.hu-tao128.rustidian</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundleExecutable</key><string>rustidian-ui</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSMinimumSystemVersion</key><string>10.15</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          tar -czf "rustidian-ui-${VERSION}-macos-${ARCH}.tar.gz" "$APP"
          tar -czf "rustidian-ui-${VERSION}-${TARGET}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"

          cp "$BIN" "rustidian-ui-${TARGET}"
          shasum -a 256 "rustidian-ui-${TARGET}" | awk '{print $1"  rustidian-ui-'"${TARGET}"'"}' > "rustidian-ui-${TARGET}.sha256"

          # .dmg con enlace a /Applications para arrastrar y soltar.
          STAGE="dmg-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Rustidian ${VERSION}" -srcfolder "$STAGE" \
            -ov -format UDZO "rustidian-ui-${VERSION}-macos-${ARCH}.dmg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            rustidian-ui-*.tar.gz
            rustidian-ui-*-macos-*.dmg
            rustidian-ui-*-apple-darwin
            rustidian-ui-*-apple-darwin.sha256

      - name: Upload to GitHub Release
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Rustidian $TAG" --generate-notes
          gh release upload "$TAG" \
            rustidian-ui-*-macos-*.tar.gz \
            rustidian-ui-*-macos-*.dmg \
            "rustidian-ui-${{ matrix.target }}.tar.gz" \
            "rustidian-ui-${{ matrix.target }}" \
            "rustidian-ui-${{ matrix.target }}.sha256" \
            --clobber

  # ── Windows x86_64 (MSVC) ──────────────────────────────────────────────────
  windows:
    if: ${{ contains(inputs.platforms, 'windows') }}
    name: Windows x86_64
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(grep -m1 '^version' rustidian-ui/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare installer icon
        shell: pwsh
        run: |
          # Los iconos (.ico) ya están versionados en packaging/icons/windows;
          # el instalador los usa directamente desde rustidian.iss.
          if (-not (Test-Path "rustidian-ui/packaging/icons/windows/rustidian_black.ico") -or
              -not (Test-Path "rustidian-ui/packaging/icons/windows/rustidian_white.ico")) {
            throw "Faltan los iconos de Windows en packaging/icons/windows"
          }

      - name: Build
        shell: bash
        env:
          GRAPH: ${{ inputs.graph }}
        run: |
          set -euo pipefail
          FEATURES=""
          if [[ "$GRAPH" == "true" ]]; then FEATURES="--features graph"; fi
          cargo build --release -p rustidian-ui $FEATURES

      - name: Package (.zip, raw binary, checksum)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $target = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item "target/release/rustidian-ui.exe" "stage/"
          if (Test-Path "README.md") { Copy-Item "README.md" "stage/" }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   "stage/" }
          Compress-Archive -Path "stage/*" `
            -DestinationPath "rustidian-ui-$version-$target.zip" -Force
          Copy-Item "target/release/rustidian-ui.exe" "rustidian-ui-$target.exe" -Force

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum rustidian-ui-x86_64-pc-windows-msvc.exe | \
            awk '{print $1"  rustidian-ui-x86_64-pc-windows-msvc.exe"}' \
            > rustidian-ui-x86_64-pc-windows-msvc.exe.sha256

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          }
          if (-not (Test-Path $iscc)) { throw "No se encontró ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD" `
            "rustidian-ui\packaging\windows\rustidian.iss"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            rustidian-ui-*-x86_64-pc-windows-msvc.zip
            rustidian-ui-x86_64-pc-windows-msvc.exe
            rustidian-ui-x86_64-pc-windows-msvc.exe.sha256
            RustidianSetup-*.exe

      - name: Upload to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Rustidian $TAG" --generate-notes
          gh release upload "$TAG" \
            rustidian-ui-*-x86_64-pc-windows-msvc.zip \
            rustidian-ui-x86_64-pc-windows-msvc.exe \
            rustidian-ui-x86_64-pc-windows-msvc.exe.sha256 \
            RustidianSetup-*.exe \
            --clobber

# Windows/macOS signing is intentionally omitted: unsigned builds work but
# SmartScreen/Gatekeeper show a warning. Add a certificate later if desired.
