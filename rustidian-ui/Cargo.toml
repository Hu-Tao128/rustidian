[package]
name = "rustidian-ui"
version = "0.2.0"
edition = "2021"
description = "Ultralight Markdown note editor built with Rust and Slint."
license = "MIT"
authors = ["Alcantara Huerta Angel Josue"]
repository = "https://github.com/Hu-Tao128/rustidian"
homepage = "https://github.com/Hu-Tao128/rustidian"

# ── Debian / Ubuntu packaging (cargo-deb) ────────────────────────────────────
[package.metadata.deb]
name = "rustidian"
maintainer = "Alcantara Huerta Angel Josue <Hu-Tao128@users.noreply.github.com>"
section = "editors"
priority = "optional"
depends = "$auto, libc6, libgcc-s1, libfontconfig1, libglib2.0-0, libgtk-3-0 | libgtk-3-0t64"
assets = [
    ["target/release/rustidian-ui", "usr/bin/rustidian-ui", "755"],
    ["packaging/rustidian.desktop", "usr/share/applications/rustidian.desktop", "644"],
    ["packaging/rustidian.svg", "usr/share/icons/hicolor/scalable/apps/rustidian.svg", "644"],
    ["packaging/rustidian-white.svg", "usr/share/icons/hicolor/scalable/apps/rustidian-white.svg", "644"],
]

# ── Fedora / RHEL packaging (cargo-generate-rpm) ─────────────────────────────
[package.metadata.generate-rpm]
name = "rustidian"
summary = "Ultralight Markdown note editor"
license = "MIT"
assets = [
    { source = "target/release/rustidian-ui", dest = "/usr/bin/rustidian-ui", mode = "755" },
    { source = "packaging/rustidian.desktop", dest = "/usr/share/applications/rustidian.desktop", mode = "644" },
    { source = "packaging/rustidian.svg", dest = "/usr/share/icons/hicolor/scalable/apps/rustidian.svg", mode = "644" },
    { source = "packaging/rustidian-white.svg", dest = "/usr/share/icons/hicolor/scalable/apps/rustidian-white.svg", mode = "644" },
]

[dependencies]
rustidian-core = { path = "../rustidian-core" }
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-18"] }
dirs = "5"
# Native folder picker.  We use the GTK3 backend (available on X11) instead of
# the default xdg-portal/wayland stack to keep the old-hardware build lean.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
ureq = "2"
sha2 = "0.10"
self-replace = "1"
serde_json = "1"

[build-dependencies]
slint-build = "1.18"

[features]
graph = ["rustidian-core/graph"]
